<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="30%" cy="25%" r="75%">
      <stop offset="0%" stop-color="#12122A"/>
      <stop offset="100%" stop-color="#0C0C14"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Outer subtle ring -->
  <circle cx="256" cy="256" r="196" fill="none" stroke="#5B8FFF" stroke-width="0.5" opacity="0.18"/>

  <!-- 4-pointed spark — main shape -->
  <path d="M256 72 L288 196 L412 256 L288 316 L256 440 L224 316 L100 256 L224 196 Z"
    fill="#5B8FFF" filter="url(#glow)" opacity="0.95"/>

  <!-- Inner cutout -->
  <circle cx="256" cy="256" r="30" fill="#0C0C14"/>

  <!-- Gold center dot -->
  <circle cx="256" cy="256" r="20" fill="#E0A040"/>

  <!-- Subtle corner accent dots -->
  <circle cx="148" cy="148" r="4" fill="#5B8FFF" opacity="0.3"/>
  <circle cx="364" cy="148" r="4" fill="#5B8FFF" opacity="0.3"/>
  <circle cx="148" cy="364" r="4" fill="#5B8FFF" opacity="0.3"/>
  <circle cx="364" cy="364" r="4" fill="#5B8FFF" opacity="0.3"/>
</svg>
